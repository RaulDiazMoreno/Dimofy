# ===============================
# LOGGING DIMOFY
# ===============================
# Consola legible: fecha, nivel, logger y mensaje
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
# Nivel general
logging.level.root=INFO
logging.level.es.rdm.Dimofy=DEBUG
# Spring Security: INFO normalmente; cambiar temporalmente a DEBUG para investigar 401/403
logging.level.org.springframework.security=INFO
# Hibernate: SQL visible sin inundar con bind params
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=INFO
# Log persistente con rotacion
logging.file.name=logs/dimofy.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=10
logging.logback.rollingpolicy.total-size-cap=100MB
# Error de arranque mas informativo
spring.main.log-startup-info=true

# Rutas fisicas de recursos del frontend 

# Rutas fisicas centralizadas de recursos del frontend
app.assets.path=C:/Users/RaulD/Documents/React/dimofy/public/assets
app.covers.path=${app.assets.path}/Cover
app.artistas.path=${app.assets.path}/Artistas
app.usuarios.path=${app.assets.path}/Usuarios

# Optimizacion HTTP: comprimir respuestas de datos, no imagenes ya comprimidas
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,text/html,text/xml,text/plain,text/css,application/javascript

# Thumbnails para listados (covers/artistas). Activar una vez para generarlos.
app.thumbnails.generate-on-startup=false
app.thumbnails.max-dimension=300
app.thumbnails.target-kb=25
app.thumbnails.min-quality=0.42
